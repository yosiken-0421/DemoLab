<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ページが見つかりません</title>
<script>
  // GitHub Pages：アプリ内のページを直接開いたときはアプリのトップへ戻す
  var p = location.pathname;
  var m = p.match(/^(.*\/(nippo|keihi))\//);
  if (m) location.replace(m[1] + '/');
</script></head>
<body style="font-family:sans-serif;padding:24px">ページが見つかりません。<a href="/DemoLab/">DemoLab のトップへ</a></body></html>
